<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    /music favicon — same mark, recoloured to the acid-brutalist lime/
    magenta/black palette. Petals are flat, fully opaque (no gradient,
    no blend opacity, unlike the original) since brutalist-editorial
    wants hard, unapologetic colour rather than a soft blended swirl —
    consistent with the rest of /music's design language (hard 2-4px
    borders, offset shadows, no soft transitions).

    Background is fixed black rather than adapting to prefers-color-
    scheme, matching /music's own site background rhythm (lime top,
    black footer) rather than the OS theme.
  -->
  <defs>
    <path id="swirl" d="M 0,0 C 70,-20 100,-80 0,-100 C -30,-50 -20,-20 0,0 Z" />
  </defs>

  <circle cx="100" cy="100" r="100" fill="#000000" />

  <g transform="translate(100, 100)">
    <use href="#swirl" fill="#FF007F" />
    <use href="#swirl" fill="#D6FF00" transform="rotate(60)" />
    <use href="#swirl" fill="#FF007F" transform="rotate(120)" />
    <use href="#swirl" fill="#D6FF00" transform="rotate(180)" />
    <use href="#swirl" fill="#FF007F" transform="rotate(240)" />
    <use href="#swirl" fill="#D6FF00" transform="rotate(300)" />
  </g>

  <circle cx="100" cy="100" r="16" fill="#000000" />
</svg>
