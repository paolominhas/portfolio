<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    /web favicon — same six-petal pinwheel mark as the main portfolio
    icon (src/app/(portfolio)/icon.svg), recoloured to the navy/yellow/
    lilac editorial palette from tailwind.config.ts. Geometry (the
    `swirl` path, 60° rotations, r=100 background, r=16 centre hole)
    is untouched — only the fills changed, per the brief.

    Unlike the portfolio icon, this doesn't adapt to prefers-color-
    scheme: /web has one fixed identity (navy) regardless of the
    visitor's OS theme, same as the site itself never toggles light/
    dark, so a fixed background is more consistent than an adaptive
    one here.
  -->
  <defs>
    <path id="swirl" d="M 0,0 C 70,-20 100,-80 0,-100 C -30,-50 -20,-20 0,0 Z" />
  </defs>

  <circle cx="100" cy="100" r="100" fill="#101585" />

  <g transform="translate(100, 100)">
    <use href="#swirl" fill="#FFDD44" />
    <use href="#swirl" fill="#A78BFA" transform="rotate(60)" />
    <use href="#swirl" fill="#FFDD44" transform="rotate(120)" />
    <use href="#swirl" fill="#A78BFA" transform="rotate(180)" />
    <use href="#swirl" fill="#FFDD44" transform="rotate(240)" />
    <use href="#swirl" fill="#A78BFA" transform="rotate(300)" />
  </g>

  <circle cx="100" cy="100" r="16" fill="#101585" />
</svg>
