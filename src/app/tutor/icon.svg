<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    /tutor favicon — same six-petal pinwheel mark used across
    paolo.org.uk's subdomains (see src/app/(portfolio)/icon.svg and
    src/app/web/icon.svg), recoloured to /tutor's teal/cream/amber
    palette. Geometry untouched — only the fills changed, per the
    established convention for adding a new subdomain to the family.
  -->
  <defs>
    <path id="swirl" d="M 0,0 C 70,-20 100,-80 0,-100 C -30,-50 -20,-20 0,0 Z" />
  </defs>

  <circle cx="100" cy="100" r="100" fill="#123C3E" />

  <g transform="translate(100, 100)">
    <use href="#swirl" fill="#F2A93B" />
    <use href="#swirl" fill="#FBF6EC" transform="rotate(60)" />
    <use href="#swirl" fill="#F2A93B" transform="rotate(120)" />
    <use href="#swirl" fill="#FBF6EC" transform="rotate(180)" />
    <use href="#swirl" fill="#F2A93B" transform="rotate(240)" />
    <use href="#swirl" fill="#FBF6EC" transform="rotate(300)" />
  </g>

  <circle cx="100" cy="100" r="16" fill="#123C3E" />
</svg>
