<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <!--
    /physics favicon — same mark, recoloured to the abyss/ember/kelp
    observatory palette. The ember (warm) / kelp (cool) alternating
    petals mirror the two glow blobs used throughout physics/page.tsx
    and SimulationSandbox.tsx, so the favicon reads as the same visual
    idea shrunk down rather than an unrelated colourway.

    Fixed abyss background rather than an adaptive one, for the same
    reason as /web and /music — each subdomain now has one deliberate
    identity rather than following the visitor's OS theme.
  -->
  <defs>
    <path id="swirl" d="M 0,0 C 70,-20 100,-80 0,-100 C -30,-50 -20,-20 0,0 Z" />
  </defs>

  <circle cx="100" cy="100" r="100" fill="#0A0E1A" />

  <g transform="translate(100, 100)">
    <use href="#swirl" fill="#FF6B3D" />
    <use href="#swirl" fill="#2F9E7C" transform="rotate(60)" />
    <use href="#swirl" fill="#FF6B3D" transform="rotate(120)" />
    <use href="#swirl" fill="#2F9E7C" transform="rotate(180)" />
    <use href="#swirl" fill="#FF6B3D" transform="rotate(240)" />
    <use href="#swirl" fill="#2F9E7C" transform="rotate(300)" />
  </g>

  <circle cx="100" cy="100" r="16" fill="#0A0E1A" />
</svg>
